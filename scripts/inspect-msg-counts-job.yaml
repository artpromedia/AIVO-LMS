apiVersion: batch/v1
kind: Job
metadata:
  name: inspect-msg-counts
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: psql
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          psql "$DATABASE_URL" <<'SQL'
          \echo === counts ===
          SELECT 'messages' AS t, count(*) FROM messages
          UNION ALL SELECT 'message_threads', count(*) FROM message_threads
          UNION ALL SELECT 'message_thread_participants', count(*) FROM message_thread_participants
          UNION ALL SELECT 'thread_participants', count(*) FROM thread_participants
          UNION ALL SELECT 'conversations', count(*) FROM conversations;
          \echo === references to messages/conversations tables ===
          SELECT tc.table_name, kcu.column_name, ccu.table_name AS foreign_table
          FROM information_schema.table_constraints tc
          JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name
          JOIN information_schema.constraint_column_usage ccu ON tc.constraint_name = ccu.constraint_name
          WHERE tc.constraint_type = 'FOREIGN KEY'
            AND ccu.table_name IN ('messages','message_threads','conversations','thread_participants');
          SQL
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: database-url
