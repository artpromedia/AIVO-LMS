<!doctype html>
<!--
  Branded report template (Sprint 10) for PDF rendering via Playwright.
  Placeholders ({{...}}) are filled by src/runners/pdf.ts, which fetches the
  tenant logo + primary color from tenant-svc. This static template is the
  reference layout; renderReportHtml() produces the same structure inline so
  the pipeline works without filesystem access in serverless workers.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; color: #111; margin: 32px; }
      header { display: flex; align-items: center; gap: 12px;
               border-bottom: 3px solid {{primaryColor}}; padding-bottom: 12px; }
      h1 { font-size: 20px; margin: 0; }
      table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
      th { background: {{primaryColor}}; color: #fff; text-align: left; padding: 6px 8px; }
      td { padding: 6px 8px; border-bottom: 1px solid #eee; }
      .meta { color: #666; font-size: 11px; margin-top: 4px; }
      footer { margin-top: 24px; color: #999; font-size: 10px; }
    </style>
  </head>
  <body>
    <header>
      <img src="{{logoUrl}}" height="32" alt="logo" />
      <div>
        <h1>{{title}}</h1>
        <div class="meta">{{tenantName}} · generated {{generatedAt}}</div>
      </div>
    </header>
    <table>
      <thead>
        <tr>{{headerCells}}</tr>
      </thead>
      <tbody>
        {{bodyRows}}
      </tbody>
    </table>
    <footer>Confidential — generated by AIVO Reports. Lineage id: {{runId}}</footer>
  </body>
</html>
