# Sprint 12.7 — minimal docker-compose harness for the Sprint 12 e2e
# suite. Brings up postgres + redis + the three services the suite
# exercises end-to-end. Builds use the existing docker/Dockerfile.service.
#
# Usage from CI:
#   docker compose -f docker-compose.e2e.yml up -d --wait
#   pnpm exec playwright test e2e/tests/sprint12 --reporter=line
#   docker compose -f docker-compose.e2e.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivo
      POSTGRES_PASSWORD: aivo
      POSTGRES_DB: aivo_e2e
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivo -d aivo_e2e"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  # One-shot generator for the stack's shared RS256 keypair. identity-svc
  # signs access tokens with it; admin-svc and web-admin verify with the
  # matching public key (JWT_KEY_DIR=/keys on all three). Throwaway e2e keys
  # on an ephemeral volume — world-readable on purpose so the non-root
  # service users can read them.
  jwt-keygen:
    image: node:22-alpine
    command:
      - node
      - -e
      - "const fs=require('fs'),c=require('crypto');if(!fs.existsSync('/keys/private.pem')){const k=c.generateKeyPairSync('rsa',{modulusLength:2048});fs.writeFileSync('/keys/private.pem',k.privateKey.export({type:'pkcs8',format:'pem'}),{mode:0o644});fs.writeFileSync('/keys/public.pem',k.publicKey.export({type:'spki',format:'pem'}),{mode:0o644});}"
    volumes:
      - jwt-keys:/keys

  identity-svc:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: identity-svc
    environment:
      NODE_ENV: test
      PORT: "3001"
      DATABASE_URL: postgresql://aivo:aivo@postgres:5432/aivo_e2e
      REDIS_URL: redis://redis:6379
      JWT_KEY_DIR: /keys
      AUTH_SECRET: e2e-test-secret-please-do-not-deploy-32-chars-min
      COOKIE_SECRET: e2e-cookie-secret-test-only-32-chars-min-length
      INTERNAL_SERVICE_TOKEN: e2e-internal-service-token
      INTERNAL_AI_TOKEN: e2e-internal-ai-token
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGINS: http://localhost:5000
      # Enables /api/__test__/* seed helpers (seed-parent, seed-district-admin,
      # seed-platform-admin, last-mfa-code, …) consumed by e2e/lib/fixtures.ts.
      # Gated to NODE_ENV != production in the handlers — never set in a deploy.
      IDENTITY_TEST_MODE: "1"
      # Sprint 1 pilot orchestration: identity-svc → billing-svc (provision) and
      # → comms-svc (first-admin invite). Internal keys default to the shared dev
      # key on both sides; the billing call uses INTERNAL_SERVICE_TOKEN above.
      BILLING_SVC_URL: http://billing-svc:3009
      COMMS_SVC_URL: http://comms-svc:3010
      WEB_BASE_URL: http://localhost:5000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      jwt-keygen: { condition: service_completed_successfully }
    volumes:
      - jwt-keys:/keys
    ports:
      - "3001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3001/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  integration-svc:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: integration-svc
    environment:
      NODE_ENV: test
      PORT: "3068"
      INTEGRATION_PORT: "3068"
      DATABASE_URL: postgresql://aivo:aivo@postgres:5432/aivo_e2e
      INTERNAL_SERVICE_TOKEN: e2e-internal-service-token
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "3068:3068"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3068/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  comms-svc:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: comms-svc
    environment:
      NODE_ENV: test
      PORT: "3010"
      DATABASE_URL: postgresql://aivo:aivo@postgres:5432/aivo_e2e
      POSTMARK_WEBHOOK_SECRET: e2e-postmark-secret
      MAILGUN_WEBHOOK_SIGNING_KEY: e2e-mailgun-key
      AIVO_SNS_WEBHOOK_SECRET: e2e-sns-secret
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "3010:3010"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3010/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------
  # District-pilot harness (Sprint 0+). These services sit behind the `pilot`
  # compose profile so the existing bare `docker compose up --wait` used by the
  # Sprint 12 job never starts the heavy web builds — only the district-pilot
  # workflow (which passes `--profile pilot`) brings them up.
  #
  # Sprint 0 exercises web-v2 real-auth login against identity-svc. billing-svc
  # and web-admin are defined here so later sprints (pilot provisioning, parent
  # invite) layer on without re-touching the harness.
  # ---------------------------------------------------------------------------
  billing-svc:
    profiles: ["pilot"]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: billing-svc
    environment:
      NODE_ENV: test
      PORT: "3009"
      BILLING_SVC_PORT: "3009"
      DATABASE_URL: postgresql://aivo:aivo@postgres:5432/aivo_e2e
      INTERNAL_SERVICE_TOKEN: e2e-internal-service-token
      # Enables /api/__test__/billing/* helpers; gated to NODE_ENV != production.
      BILLING_TEST_MODE: "1"
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "3009:3009"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3009/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  web-v2:
    profiles: ["pilot"]
    build:
      context: .
      dockerfile: apps/web-v2/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOSTNAME: "0.0.0.0"
      # Real identity-svc session — NO mock on the pilot path. AUTH_MODE=custom
      # is a production-grade provider value (env.ts refuses "mock" in prod), so
      # readMockSessionFromCookies() only honors the real aivo_session cookie.
      AUTH_MODE: custom
      AIVO_PERSISTENCE: postgres
      DATABASE_URL: postgresql://aivo:aivo@postgres:5432/aivo_e2e
      IDENTITY_SVC_URL: http://identity-svc:3001
      BILLING_SVC_URL: http://billing-svc:3009
      COMMS_SVC_URL: http://comms-svc:3010
      SESSION_SECRET: e2e-web-v2-session-secret-32-chars-minimum-len
      NEXT_PUBLIC_APP_URL: http://localhost:5000
      # getIdentityBaseSession() verifies the access-token JWT when web-v2 holds
      # identity-svc's RS256 public key. Set JWT_PUBLIC_KEY (matching the key
      # identity-svc signs with) to make verification authoritative here;
      # otherwise the reader falls back to the httpOnly login snapshot (still
      # server-set / not user-forgeable). Both keep the pilot session real.
    depends_on:
      postgres: { condition: service_healthy }
      identity-svc: { condition: service_healthy }
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:5000/api/bff/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  # Platform BFF for web-admin reads (system health, usage trends, …).
  # Shares the e2e postgres with identity-svc so seeded users/learners show
  # up in the platform dashboards, and the /keys public key so it can verify
  # identity-minted bearer tokens.
  admin-svc:
    profiles: ["pilot"]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: admin-svc
    environment:
      NODE_ENV: test
      ADMIN_SVC_PORT: "3005"
      DATABASE_URL: postgresql://aivo:aivo@postgres:5432/aivo_e2e
      IDENTITY_SVC_URL: http://identity-svc:3001
      INTERNAL_SERVICE_TOKEN: e2e-internal-service-token
      JWT_KEY_DIR: /keys
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      jwt-keygen: { condition: service_completed_successfully }
    ports:
      - "3005:3005"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3005/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  web-admin:
    profiles: ["pilot"]
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "5001"
      HOSTNAME: "0.0.0.0"
      IDENTITY_SVC_URL: http://identity-svc:3001
      BILLING_SVC_URL: http://billing-svc:3009
      ADMIN_SVC_URL: http://admin-svc:3005
      INTERNAL_SERVICE_TOKEN: e2e-internal-service-token
      SESSION_SECRET: e2e-web-admin-session-secret-32-chars-min-len
      # Verify identity-minted session JWTs with the stack's shared public key.
      JWT_KEY_DIR: /keys
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      identity-svc: { condition: service_healthy }
      admin-svc: { condition: service_healthy }
    ports:
      - "5001:5001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:5001/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  # Shared RS256 keypair for the stack (see jwt-keygen).
  jwt-keys:
