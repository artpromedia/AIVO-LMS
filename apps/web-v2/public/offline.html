<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AIVO — Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5B3FB4" />
    <link rel="icon" href="/images/favicon-192.png" />
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #faf7f2;
        color: #1b1b1b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        font-size: 1.75rem;
        margin: 1.5rem 0 0.5rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.5;
        color: #4a4a4a;
      }
      button {
        margin-top: 1.5rem;
        background: #5b3fb4;
        color: #fff;
        border: 0;
        border-radius: 9999px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/favicon-192.png" alt="AIVO" />
      <h1>You&rsquo;re offline</h1>
      <p>
        We can&rsquo;t reach AIVO right now. Check your connection and try again. Your work is saved
        on this device and will sync when you&rsquo;re back online.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
