image:
  repository: ghcr.io/artpromedia
  # Always pull on rollout: services use the floating :latest tag and Hetzner
  # nodes can otherwise serve stale cached images after a fresh GHCR push.
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

replicaCount: 2

resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "100m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector:
  role: app

envFrom:
  - secretRef:
      name: aivo-common-env

env:
  NODE_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json

serviceMonitor:
  enabled: true
  interval: 30s

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: aivo-prod
      ports:
        - protocol: TCP
          port: 3000
