# =============================================================================
# AIVO Service - Default Values
# =============================================================================
# Override these values per service and environment
# =============================================================================

# Service name (REQUIRED - must be set per service)
serviceName: ""

# Number of replicas
replicaCount: 2

# Image configuration
image:
  repository: ghcr.io/artpromedia
  pullPolicy: IfNotPresent
  tag: "latest"

# Image pull secrets for private registries
imagePullSecrets: []

# Override names
nameOverride: ""
fullnameOverride: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

# Pod security context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.aivo.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aivo-tls
      hosts:
        - api.aivo.ai

# Resource limits and requests
resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "100m"
    memory: "256Mi"

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Alternative to minAvailable

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules — podAntiAffinity is auto-injected by the deployment template
# using the resolved serviceName. Set to {} to use only the auto-injected rules.
affinity: {}

# Liveness probe — uses the HTTP /health endpoint exposed by every
# AIVO service (Fastify + FastAPI both register one). TCP-only probes
# would pass even if the service can't reach Postgres / Redis. Services
# that need a different path can override `livenessProbe.httpGet.path`.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Readiness probe — also uses /health so we don't roll traffic onto a
# pod that's up but not yet wired to its dependencies.
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# Startup probe (for slow-starting containers)
startupProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30  # 30 * 5 = 150s max startup time

# Environment variables
env:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info
  LOG_FORMAT: json

# Environment variables from ConfigMaps/Secrets
envFrom: []
#  - configMapRef:
#      name: common-config
#  - secretRef:
#      name: common-secrets

# ConfigMap data
configMap:
  enabled: false
  data: {}

# Secret data (use external secrets in production)
secret:
  enabled: false
  data: {}

# External Secrets configuration
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store
  data: []
  #  - secretKey: DATABASE_URL
  #    remoteRef:
  #      key: aivo/database-url

# Volume mounts
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /home/nodejs/.cache

# Volumes
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}

# Init containers
initContainers: []
#  - name: wait-for-db
#    image: busybox:1.36
#    command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 2; done']

# Sidecar containers
sidecars: []

# Service mesh configuration
serviceMesh:
  enabled: false
  istio:
    virtualService:
      enabled: false
    destinationRule:
      enabled: false

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kong
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to: []  # Allow all egress (restrict in production)
      ports: []

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}

# Prometheus alerts
prometheusRule:
  enabled: false
  rules: []

# Datadog APM
datadog:
  enabled: false
  env: staging
  service: ""
  version: ""
