# HashiCorp Vault - Production Configuration
# Deploy: helm install vault hashicorp/vault -n vault --create-namespace -f values.yaml
global:
  enabled: true
  tlsDisable: false

server:
  image:
    repository: hashicorp/vault
    tag: "1.15.4"

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  # HA with Raft integrated storage
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/vault/userconfig/vault-tls/tls.crt"
          tls_key_file = "/vault/userconfig/vault-tls/tls.key"
        }

        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "https://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-2.vault-internal:8200"
          }
        }

        seal "transit" {
          address = ""
          disable_renewal = "false"
          key_name = "autounseal"
          mount_path = "transit/"
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: hcloud-volumes

  auditStorage:
    enabled: true
    size: 10Gi
    storageClass: hcloud-volumes

  # Vault auto-unseal using Hetzner Cloud KMS or transit
  # For initial setup, use Shamir keys and migrate later

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m
