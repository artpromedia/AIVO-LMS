# =============================================================================
# ClamAV — in-cluster antivirus daemon for IEP document uploads (assessment-svc)
# =============================================================================
# assessment-svc POST /api/iep/upload-pdf streams each uploaded PDF to clamd over
# the INSTREAM protocol (services/assessment-svc/src/lib/av-scan.ts). The scan is
# OPT-IN: only active once `CLAMAV_HOST` is set on assessment-svc. Policy:
#   * infected            → 422 (always rejected)
#   * scanner unreachable  → 503 fail-CLOSED in prod (NODE_ENV=production) or when
#                            IEP_AV_REQUIRED=true; otherwise the upload proceeds.
# Because prod fails closed, clamd must stay healthy — hence a single durable
# Deployment + Service here, enabled via scripts/setup-iep-clamav.sh (which proves
# EICAR detection through this Service BEFORE flipping CLAMAV_HOST).
#
# Apply: kubectl apply -f infra/k8s/base/clamav.yaml   (namespace aivo)
# Image: clamav/clamav:stable_base ships the signature DB baked in, so clamd
#        starts without first downloading from the freshclam mirrors (egress-
#        independent cold start); freshclam still refreshes signatures in the
#        background. clamd listens on TCP 3310 by default.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  namespace: aivo
  labels:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/part-of: aivo
    app.kubernetes.io/component: antivirus
spec:
  replicas: 1
  # maxUnavailable=0 keeps the old clamd serving until the replacement has
  # loaded its DB and is Ready, so an IEP upload never hits a 503 window during
  # a routine restart/upgrade.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
        app.kubernetes.io/part-of: aivo
        app.kubernetes.io/component: antivirus
    spec:
      # clamd needs no Kubernetes API access.
      automountServiceAccountToken: false
      securityContext:
        # The image's entrypoint runs as root to chown /var/lib/clamav, then
        # drops to the `clamav` user (uid 100) for clamd/freshclam itself.
        fsGroup: 100
      containers:
        - name: clamav
          image: clamav/clamav:stable_base
          imagePullPolicy: IfNotPresent
          ports:
            - name: clamd
              containerPort: 3310
              protocol: TCP
          env:
            - name: CLAMAV_NO_CLAMD
              value: "false"
            - name: CLAMAV_NO_FRESHCLAMD
              value: "false"
            # Give clamd up to 30 min to finish loading the DB before the
            # entrypoint's own watchdog gives up (k8s probes gate readiness).
            - name: CLAMD_STARTUP_TIMEOUT
              value: "1800"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
              # Covers the signature-DB emptyDir (reseeded per pod) + /tmp + logs.
              ephemeral-storage: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
          # clamd only opens TCP 3310 after the signature DB is fully loaded, so
          # a TCP probe is an accurate readiness signal. The startupProbe gives
          # the first DB load generous time before liveness starts judging.
          startupProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: clamav-db
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
      volumes:
        # Signature DB is ephemeral per-pod (the _base image reseeds it on
        # start); no PVC so the pod is free to reschedule across nodes.
        - name: clamav-db
          emptyDir:
            sizeLimit: 3Gi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: aivo
  labels:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/part-of: aivo
    app.kubernetes.io/component: antivirus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: 3310
      protocol: TCP
