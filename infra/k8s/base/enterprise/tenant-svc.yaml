apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-svc
  labels:
    app: tenant-svc
    app.kubernetes.io/part-of: aivo-enterprise
spec:
  replicas: 2
  selector:
    matchLabels: { app: tenant-svc }
  template:
    metadata:
      labels: { app: tenant-svc }
    spec:
      containers:
        - name: app
          image: aivo/tenant-svc:latest
          ports: [{ name: http, containerPort: 3067 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3067" }
            - { name: TENANT_PORT, value: "3067" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: aivo-common-env, key: DATABASE_URL }
            - { name: AUDIT_SVC_URL, value: "http://audit-svc:3069" }
            - name: AIVO_FEATURE_DISTRICT_ENTERPRISE_MODE
              valueFrom:
                configMapKeyRef: { name: aivo-enterprise-flags, key: AIVO_FEATURE_DISTRICT_ENTERPRISE_MODE, optional: true }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-svc
spec:
  selector: { app: tenant-svc }
  ports: [{ name: http, port: 3067, targetPort: http }]
