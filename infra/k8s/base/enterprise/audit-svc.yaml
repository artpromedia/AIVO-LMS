apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-svc
  labels:
    app: audit-svc
    app.kubernetes.io/part-of: aivo-enterprise
spec:
  replicas: 2
  selector:
    matchLabels: { app: audit-svc }
  template:
    metadata:
      labels: { app: audit-svc }
    spec:
      containers:
        - name: app
          image: aivo/audit-svc:${IMAGE_TAG:-latest}
          ports: [{ name: http, containerPort: 3069 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3069" }
            - { name: AUDIT_PORT, value: "3069" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: aivo-common-env, key: DATABASE_URL }
            - name: AIVO_FEATURE_DATA_GOVERNANCE_CENTER
              valueFrom:
                configMapKeyRef:
                  {
                    name: aivo-enterprise-flags,
                    key: AIVO_FEATURE_DATA_GOVERNANCE_CENTER,
                    optional: true,
                  }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: audit-svc
spec:
  selector: { app: audit-svc }
  ports: [{ name: http, port: 3069, targetPort: http }]
