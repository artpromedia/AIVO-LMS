apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-recognizer-svc
  labels:
    app: math-recognizer-svc
    app.kubernetes.io/part-of: aivo-enterprise
spec:
  replicas: 2
  selector:
    matchLabels: { app: math-recognizer-svc }
  template:
    metadata:
      labels: { app: math-recognizer-svc }
    spec:
      containers:
        - name: app
          image: aivo/math-recognizer-svc:latest
          ports: [{ name: http, containerPort: 3062 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3062" }
            - { name: MATH_RECOGNIZER_PORT, value: "3062" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: math-recognizer-svc
spec:
  selector: { app: math-recognizer-svc }
  ports: [{ name: http, port: 3062, targetPort: http }]
