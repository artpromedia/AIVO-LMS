apiVersion: apps/v1
kind: Deployment
metadata:
  name: responsible-ai-svc
  labels:
    app: responsible-ai-svc
    app.kubernetes.io/part-of: aivo-enterprise
spec:
  replicas: 2
  selector:
    matchLabels: { app: responsible-ai-svc }
  template:
    metadata:
      labels: { app: responsible-ai-svc }
    spec:
      containers:
        - name: app
          image: aivo/responsible-ai-svc:${IMAGE_TAG:-latest}
          ports: [{ name: http, containerPort: 3071 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3071" }
            - { name: RESPONSIBLE_AI_PORT, value: "3071" }
            - name: AIVO_FEATURE_RESPONSIBLE_AI_GUARDRAILS
              valueFrom:
                configMapKeyRef:
                  {
                    name: aivo-enterprise-flags,
                    key: AIVO_FEATURE_RESPONSIBLE_AI_GUARDRAILS,
                    optional: true,
                  }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: responsible-ai-svc
spec:
  selector: { app: responsible-ai-svc }
  ports: [{ name: http, port: 3071, targetPort: http }]
