apiVersion: v1
kind: ConfigMap
metadata:
  name: aivo-enterprise-flags
  labels:
    app.kubernetes.io/part-of: aivo-enterprise
# All sprint features have landed, so every flag ships ON. Notable runtime
# effects of the flags:
#   - AIVO_FEATURE_ADVANCED_CONTENT_GENERATORS (Sprint C): activates
#     subject-brain enrichment for all 14 tutor brains. Call sites swallow
#     errors and fall back to legacy generation if subject-brain-svc is
#     unreachable.
#   - AIVO_FEATURE_RESPONSIBLE_AI_GUARDRAILS (Sprint G): the
#     responsible-ai-svc evaluator runs on every tutor chat and homework
#     output. In production tutor-svc uses policyMode=block so confirmed
#     prompt-injection or profile-adherence violations stop the output.
#   - AIVO_FEATURE_DATA_GOVERNANCE_CENTER (Sprint G): parent DSAR
#     export and deletion requests fan out to data-governance-svc.
#   - AIVO_FEATURE_SIS_SYNC and AIVO_FEATURE_LTI_13 (Sprint H):
#     admin rostering imports forward Clever / ClassLink exports to
#     integration-svc; LTI 1.3 launch validator rejects unsigned tokens.
# To disable a feature, flip its value here and redeploy — this ConfigMap
# is the single switchboard for the admin flag dashboard and the
# flag-consuming services.
data:
  AIVO_FEATURE_PROBLEM_SESSION_LEDGER: "true"
  AIVO_FEATURE_TUTOR_SURFACE_PROTOCOL: "true"
  AIVO_FEATURE_PROFILE_RECOMMENDATIONS_V2: "true"
  AIVO_FEATURE_DISTRICT_ENTERPRISE_MODE: "true"
  ADMIN_ENTERPRISE_DELEGATED_ADMIN_RBAC_V2: "true"
  AIVO_FEATURE_SIS_SYNC: "true"
  AIVO_FEATURE_LTI_13: "true"
  AIVO_FEATURE_DATA_GOVERNANCE_CENTER: "true"
  AIVO_FEATURE_RESPONSIBLE_AI_GUARDRAILS: "true"
  AIVO_FEATURE_ADVANCED_CONTENT_GENERATORS: "true"
  AIVO_FEATURE_SELF_REGULATION_HUB: "true"
  AIVO_FEATURE_TUTOR_AGENTIC_MODE: "true"
