apiVersion: apps/v1
kind: Deployment
metadata:
  name: subject-brain-svc
  labels:
    app: subject-brain-svc
    app.kubernetes.io/part-of: aivo-enterprise
spec:
  replicas: 2
  selector:
    matchLabels: { app: subject-brain-svc }
  template:
    metadata:
      labels: { app: subject-brain-svc }
    spec:
      containers:
        - name: app
          image: aivo/subject-brain-svc:${IMAGE_TAG:-latest}
          ports: [{ name: http, containerPort: 3064 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3064" }
            - { name: SUBJECT_BRAIN_PORT, value: "3064" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: subject-brain-svc
spec:
  selector: { app: subject-brain-svc }
  ports: [{ name: http, port: 3064, targetPort: http }]
