apiVersion: apps/v1
kind: Deployment
metadata:
  name: problem-session-svc
  labels:
    app: problem-session-svc
    app.kubernetes.io/name: problem-session-svc
    app.kubernetes.io/part-of: aivo-enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: problem-session-svc
  template:
    metadata:
      labels:
        app: problem-session-svc
        app.kubernetes.io/name: problem-session-svc
    spec:
      containers:
        - name: app
          image: aivo/problem-session-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3061
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3061"
            - name: PROBLEM_SESSION_PORT
              value: "3061"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aivo-common-env
                  key: DATABASE_URL
            - name: AUDIT_SVC_URL
              value: http://audit-svc:3069
            - name: AIVO_FEATURE_PROBLEM_SESSION_LEDGER
              valueFrom:
                configMapKeyRef:
                  name: aivo-enterprise-flags
                  key: AIVO_FEATURE_PROBLEM_SESSION_LEDGER
                  optional: true
            - name: AIVO_FEATURE_DATA_GOVERNANCE_CENTER
              valueFrom:
                configMapKeyRef:
                  name: aivo-enterprise-flags
                  key: AIVO_FEATURE_DATA_GOVERNANCE_CENTER
                  optional: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: problem-session-svc
  labels:
    app: problem-session-svc
spec:
  type: ClusterIP
  selector:
    app: problem-session-svc
  ports:
    - name: http
      port: 3061
      targetPort: http
