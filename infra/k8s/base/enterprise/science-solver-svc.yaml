apiVersion: apps/v1
kind: Deployment
metadata:
  name: science-solver-svc
  labels:
    app: science-solver-svc
    app.kubernetes.io/part-of: aivo-enterprise
spec:
  replicas: 2
  selector:
    matchLabels: { app: science-solver-svc }
  template:
    metadata:
      labels: { app: science-solver-svc }
    spec:
      containers:
        - name: app
          image: aivo/science-solver-svc:latest
          ports: [{ name: http, containerPort: 3063 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3063" }
            - { name: SCIENCE_SOLVER_PORT, value: "3063" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: science-solver-svc
spec:
  selector: { app: science-solver-svc }
  ports: [{ name: http, port: 3063, targetPort: http }]
