name: Marketing Lighthouse

on:
  pull_request:
    paths:
      - "apps/marketing/**"
      - "packages/brand/**"
      - "packages/ui/**"

permissions:
  contents: read

concurrency:
  group: marketing-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        run: pnpm exec turbo run build --filter=@aivo/marketing

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun || true
        continue-on-error: true
