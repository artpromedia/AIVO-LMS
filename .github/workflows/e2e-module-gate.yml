name: E2E Module Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/**'
      - 'apps/mobile/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e-module-gate.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  API_BASE_URL: http://localhost:3101
  BRAIN_API_URL: http://localhost:3002
  DATABASE_URL: postgresql://aivo:aivo_test@localhost:5433/aivo_test
  CI: true

jobs:
  e2e-module-gate:
    name: E2E Module Gate Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aivo
          POSTGRES_PASSWORD: aivo_test
          POSTGRES_DB: aivo_test
        options: >-
          --health-cmd "pg_isready -U aivo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: pip install -r services/brain-svc/requirements.txt

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Push test schema
        env:
          DATABASE_URL: postgresql://aivo:aivo_test@localhost:5433/aivo_test
        run: pnpm db:push --force || true

      - name: Start services
        run: |
          cd services/brain-svc && PYTHONPATH=src python -m uvicorn brain_svc.main:app --host 0.0.0.0 --port 3002 &
          sleep 5

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health > /dev/null 2>&1; then
              echo "brain-svc healthy"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done

      - name: Run tests
        run: |
          if [ -d e2e ]; then
            pnpm --filter @aivo/e2e test || true
          else
            echo "E2E tests directory not yet created"
          fi

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run web E2E smoke specs
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:5000
          CI: "true"
        run: npx playwright test tests/e2e --reporter=line

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: e2e/reports/
          retention-days: 14
          if-no-files-found: ignore
