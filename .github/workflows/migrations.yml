name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      action:
        description: "Migration action"
        required: true
        type: choice
        options:
          - push
          - status

env:
  NODE_VERSION: "22"

jobs:
  migrate:
    name: Run Database Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.action }}" == "push" ]; then
            echo "Pushing schema to ${{ inputs.environment }}..."
            pnpm db:push --force
          else
            echo "Checking migration status..."
            pnpm --filter @aivo/db exec drizzle-kit studio --port 0 || echo "Status check complete"
          fi

      - name: Verify schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Verifying database schema..."
          psql "$DATABASE_URL" -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;" || echo "Schema verification complete"
