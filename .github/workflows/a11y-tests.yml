name: Accessibility Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

permissions:
  contents: read
  actions: read

jobs:
  a11y-lint:
    name: A11y Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run ESLint with a11y plugin
        run: pnpm --filter @aivo/web lint
        continue-on-error: false

  a11y-playwright:
    name: A11y Playwright Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run accessibility specs (login, signup, dashboards, parent-dashboard, learner-stage)
        working-directory: apps/web
        run: npx playwright test tests/a11y/ --reporter=list
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
