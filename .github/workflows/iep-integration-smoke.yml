name: IEP integration smoke

on:
  workflow_dispatch:
    inputs:
      ai_svc_url:
        description: ai-svc base URL
        required: true
      assessment_svc_url:
        description: assessment-svc base URL
        required: true
  workflow_call:
    inputs:
      ai_svc_url:
        required: true
        type: string
      assessment_svc_url:
        required: true
        type: string
    secrets:
      INTERNAL_AI_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  smoke:
    name: IEP draft round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run IEP integration smoke
        env:
          AI_SVC_URL: ${{ inputs.ai_svc_url }}
          ASSESSMENT_SVC_URL: ${{ inputs.assessment_svc_url }}
          INTERNAL_AI_TOKEN: ${{ secrets.INTERNAL_AI_TOKEN }}
        run: |
          chmod +x scripts/smoke/iep-integration-smoke.sh
          ./scripts/smoke/iep-integration-smoke.sh
