name: Study Routes Regression Gate

# Guards against learner study surfaces silently degrading back into
# stub / coming-soon / placeholder content, and against quest content
# losing chapters or boss assessments. Runs alongside the existing
# Playwright a11y job; intentionally small so it stays a fast PR gate.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "services/engagement-svc/**"
      - "services/tutor-svc/**"
      - "packages/billing-entitlements/**"
      - ".github/workflows/study-routes-regression.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "services/engagement-svc/**"

permissions:
  contents: read

concurrency:
  group: study-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-gate:
    name: Quest content seed gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages required by tests
        run: |
          pnpm --filter @aivo/billing-entitlements run build
          pnpm --filter @aivo/db run build || true
      - name: Run engagement-svc quest content + resolver tests
        working-directory: services/engagement-svc
        run: |
          npx tsx --test \
            tests/quest-worlds.test.ts \
            tests/quest-content.test.ts \
            tests/quest-content-gate.test.ts
      - name: Run tutor-svc learner entitlement tests
        working-directory: services/tutor-svc
        run: npx tsx --test tests/learner-entitlements.test.ts

  route-crawler:
    name: Learner study route crawler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run learner study-route regression crawler
        working-directory: apps/web
        run: npx playwright test tests/e2e/learner-study-routes.spec.ts tests/e2e/learner-quests.spec.ts tests/e2e/learner-quest-play.spec.ts --reporter=list
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-study-routes
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
