name: billing-ci

on:
  pull_request:
    paths:
      - "apps/web/src/app/dashboard/parent/billing/**"
      - "apps/web/src/app/dashboard/learner/lesson/**"
      - "apps/web/src/app/dashboard/learner/tutors/**"
      - "apps/web/src/hooks/useBillingState.ts"
      - "apps/web/src/hooks/useLearnerEntitlements.ts"
      - "apps/web/src/components/billing/**"
      - "apps/mobile/app/(parent)/billing.tsx"
      - "apps/mobile/app/(learner)/tutor/**"
      - "apps/mobile/app/(learner)/stage/**"
      - "apps/mobile/hooks/useLearnerEntitlements.ts"
      - "apps/mobile/src/api/sessionClient.ts"
      - "packages/billing-entitlements/**"
      - "packages/db/src/schema/billing.ts"
      - "packages/db/drizzle/0030*"
      - "packages/db/drizzle/0031*"
      - "packages/db/drizzle/0032*"
      - "services/billing-svc/**"
      - "services/tutor-svc/src/lib/entitlements.ts"
      - "services/tutor-svc/src/routes/chat.ts"
      - "services/tutor-svc/src/routes/store.ts"
      - "services/learning-svc/src/lib/entitlements.ts"
      - "services/learning-svc/src/routes/sessions.ts"
      - "scripts/check-billing-guard.mjs"
      - "scripts/stripe-setup.ts"
      - ".github/workflows/billing-ci.yml"
  push:
    branches: [main]

concurrency:
  group: billing-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # The integration suite signs webhook events with this key. It must
  # match the one billing-svc reads from STRIPE_WEBHOOK_SECRET while
  # under test mode.
  STRIPE_WEBHOOK_SECRET: whsec_test_integration_secret
  # Test mode opt-ins consumed by the orchestrator.
  BILLING_TEST_MODE: "1"
  IDENTITY_TEST_MODE: "1"

jobs:
  guard:
    name: Forbidden-pattern guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The guard has zero deps so it runs without pnpm install.
      - name: Run billing-guard
        run: node scripts/check-billing-guard.mjs

  entitlements-unit:
    name: Entitlements package unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aivo/billing-entitlements run build
      - run: pnpm --filter @aivo/billing-entitlements run test

  webhook-unit:
    name: billing-svc webhook unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build billing-svc + deps
        run: |
          pnpm --filter @aivo/db run build
          pnpm --filter @aivo/billing-entitlements run build
          pnpm --filter @aivo/billing-svc run build
      - name: Run billing-svc unit tests (skips DB tests without DATABASE_URL)
        run: pnpm --filter @aivo/billing-svc run test

  integration:
    name: billing + entitlement integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aivo
          POSTGRES_PASSWORD: aivo
          POSTGRES_DB: aivo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U aivo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgres://aivo:aivo@localhost:5432/aivo_test
      DATABASE_URL: postgres://aivo:aivo@localhost:5432/aivo_test
      JWT_PRIVATE_KEY: ${{ secrets.E2E_JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.E2E_JWT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: |
          pnpm --filter @aivo/db run build
          pnpm --filter @aivo/billing-entitlements run build
          pnpm --filter @aivo/security run build
          pnpm --filter @aivo/observability run build
      - name: Apply DB migrations
        run: pnpm --filter @aivo/db run db:migrate
      - name: Run billing + entitlement integration suite
        run: pnpm --filter @aivo/integration-tests run test -- billing-webhook.test.ts billing-entitlement-gate.test.ts
