name: Production Gates

# Runs the release-discipline gates on every PR and on push to main:
# repo:health, brand:check, prod:check, prod:no-demo,
# prod:surface-contract, and test:production-readiness.
#
# Sprint 02 ownership. Keep this workflow free of project-specific
# logic — it should only invoke root scripts that exist in package.json.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: production-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  gates:
    name: Release-discipline gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: repo:health
        run: pnpm repo:health

      - name: brand:check
        run: pnpm brand:check

      - name: auth:audit
        run: pnpm auth:audit

      - name: consent:audit
        run: pnpm consent:audit

      - name: curriculum:validate
        run: pnpm curriculum:validate

      - name: onboarding:audit
        run: pnpm onboarding:audit

      - name: lessonrun:audit
        run: pnpm lessonrun:audit

      - name: route:audit
        run: pnpm route:audit

      - name: shell:audit
        run: pnpm shell:audit

      - name: rbac:audit
        run: pnpm rbac:audit

      - name: "@aivo/nav unit tests"
        run: corepack pnpm --filter @aivo/nav test

      - name: mobile:audit
        run: pnpm mobile:audit

      - name: mobile:single-listing
        run: pnpm mobile:single-listing

      - name: marketing:audit
        run: pnpm marketing:audit

      - name: billing:audit
        run: pnpm billing:audit

      - name: rostering:audit
        run: pnpm rostering:audit

      - name: comms:audit
        run: pnpm comms:audit

      - name: ai-safety:audit
        run: pnpm ai-safety:audit

      - name: accessibility:audit
        run: pnpm accessibility:audit
      - name: observability:audit
        run: pnpm observability:audit
      - name: mobile:a11y-ratchet
        run: pnpm mobile:a11y-ratchet
      - name: feature-flag:audit
        run: pnpm feature-flag:audit
      - name: audit-trail:audit
        run: pnpm audit-trail:audit
      - name: design-token:audit
        run: pnpm design-token:audit

      - name: prod:no-demo scan
        run: pnpm prod:no-demo

      - name: prod:surface-contract scan
        run: pnpm prod:surface-contract

      - name: prod:check
        run: pnpm prod:check

      - name: test:production-readiness
        run: pnpm test:production-readiness
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/aivo_test' }}

  # Will become blocking once all services in scripts/dump-openapi.mjs have typed OpenAPI contracts (tracked: docs/adr/0019-openapi-contract-coverage.md).
  api-client-drift-gate:
    name: API client drift (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Stays advisory until every service in scripts/dump-openapi.mjs
    # has typed body/querystring/params/response on every public route
    # (see comment in .github/workflows/api-client-drift.yml).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: api:check
        run: pnpm api:check

  summary:
    name: Gates summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - gates
    steps:
      - name: Report
        env:
          GATES: ${{ needs.gates.result }}
        run: |
          {
            echo "## Production Gates"
            echo ""
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| repo:health, brand:check, prod:* | $GATES |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GATES" != "success" ]; then
            echo "::error::Production gates failed — see job logs."
            exit 1
          fi
