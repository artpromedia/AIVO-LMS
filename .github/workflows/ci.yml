name: AIVO CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  i18n-and-completeness:
    name: i18n Coverage & No "Coming Soon"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check locale parity (web-v2, mobile, i18n-svc)
        run: node scripts/ci/check-i18n-coverage.mjs

      - name: Check no "coming soon" prose in production code
        run: node scripts/ci/check-no-coming-soon.mjs

  build-node:
    name: Build All Node Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and services
        run: pnpm build

  # Sprint 0 Prompt 0.2 — BFF integration contract tests.
  #
  # Runs Playwright API tests at apps/web-v2/tests/integration/bff/*.spec.ts
  # against a freshly-built web-v2 (AUTH_MODE=mock). These lock the
  # canonical { ok, requestId, error|data } envelope and the auth /
  # scope / validation status codes that packages/api-client consumers
  # rely on. The job is path-gated to changes under apps/web-v2/app/api/bff/**
  # or services/**/routes/**; non-matching runs short-circuit to a green
  # no-op so the required-status check still reports success.
  #
  # TODO(sprint-0-followup): expand into a full docker-compose harness
  # spinning up identity-svc + learning-svc + subject-brain-svc so we can
  # exercise authenticated happy paths (real session cookie, real upstream
  # contracts) on top of these envelope checks.
  bff-integration:
    name: BFF Integration (web-v2 contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5

      - name: Detect BFF / service-route changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bff:
              - 'apps/web-v2/app/api/bff/**'
              - 'apps/web-v2/lib/bff/**'
              - 'apps/web-v2/tests/integration/bff/**'
              - 'apps/web-v2/playwright.bff.config.ts'
              - 'services/**/routes/**'
              - 'packages/api-client/**'
              - '.github/workflows/ci.yml'

      - name: Skip (no BFF / service-route changes)
        if: steps.filter.outputs.bff != 'true'
        run: echo "No BFF or service-route changes detected — skipping integration suite."

      - uses: pnpm/action-setup@v5
        if: steps.filter.outputs.bff == 'true'

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.bff == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.filter.outputs.bff == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser deps
        if: steps.filter.outputs.bff == 'true'
        run: pnpm --filter @aivo/web-v2 exec playwright install --with-deps chromium

      - name: Build web-v2
        if: steps.filter.outputs.bff == 'true'
        env:
          NODE_ENV: development
          AUTH_MODE: mock
        run: pnpm --filter @aivo/web-v2 build

      - name: Start web-v2 (background, AUTH_MODE=mock)
        if: steps.filter.outputs.bff == 'true'
        env:
          NODE_ENV: development
          AUTH_MODE: mock
          PORT: "5000"
        run: |
          nohup pnpm --filter @aivo/web-v2 start > web-v2.log 2>&1 &
          echo $! > web-v2.pid

      - name: Wait for web-v2 to accept connections
        if: steps.filter.outputs.bff == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/; then
              echo "web-v2 is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::web-v2 did not become ready within 60s"
          tail -n 200 web-v2.log || true
          exit 1

      - name: Run BFF integration suite
        if: steps.filter.outputs.bff == 'true'
        env:
          WEB_V2_BASE_URL: http://127.0.0.1:5000
        run: |
          pnpm --filter @aivo/web-v2 exec playwright test \
            --config=playwright.bff.config.ts

      - name: Dump web-v2 logs on failure
        if: failure() && steps.filter.outputs.bff == 'true'
        run: tail -n 500 web-v2.log || true

      - name: Stop web-v2
        if: always() && steps.filter.outputs.bff == 'true'
        run: |
          if [ -f web-v2.pid ]; then
            kill "$(cat web-v2.pid)" || true
          fi

      - name: Upload Playwright report
        if: always() && steps.filter.outputs.bff == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bff-playwright-report
          path: |
            apps/web-v2/playwright-report
            apps/web-v2/test-results
          if-no-files-found: ignore

  background-jobs-tests:
    name: Background Jobs & Scheduler Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivo_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @aivo/db --filter @aivo/security --filter @aivo/observability --filter @aivo/scheduling --filter @aivo/ops-alert build

      - name: Run scheduling unit tests
        run: pnpm --filter @aivo/scheduling test

      - name: Run ops-alert unit tests
        run: pnpm --filter @aivo/ops-alert test

      - name: Run admin-svc tests (incl. crash-recovery + jobs endpoint)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm --filter @aivo/admin-svc test

      - name: Run billing-svc tests (daily-jobs + coupons + expiry-reminder)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm --filter @aivo/billing-svc test

      - name: Run comms-svc tests (email-events webhook)
        run: pnpm --filter @aivo/comms-svc test

  # Sprint 12.6 — gate `pnpm test:integration` and `pnpm test:enterprise`
  # on every PR. Both suites were previously runnable but not wired into
  # CI, so contract drift could land silently. The setup steps mirror
  # the production-readiness-check job (Postgres service, frozen
  # lockfile, root deps installed).
  integration-and-enterprise-tests:
    name: Integration & Enterprise Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivo_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build foundational packages
        run: pnpm --filter @aivo/db --filter @aivo/security --filter @aivo/observability --filter @aivo/scheduling build

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm test:integration

      - name: Run enterprise tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm test:enterprise

  brain-svc:
    name: Brain Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivo_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/brain-svc/requirements.txt

      - name: Install dependencies
        run: pip install -r services/brain-svc/requirements.txt

      - name: Compile check
        run: cd services/brain-svc && python -m py_compile src/brain_svc/main.py

      - name: Run tests
        working-directory: services/brain-svc
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-cov pytest-asyncio httpx
          pytest tests/ --cov=src/brain_svc --cov-report=term-missing -v || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/brain-svc/coverage.xml
          flags: brain-svc
        continue-on-error: true

  ai-svc:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f services/ai-svc/requirements.txt ]; then
            pip install -r services/ai-svc/requirements.txt
          fi

      - name: Compile check
        run: |
          if [ -f services/ai-svc/src/main.py ]; then
            cd services/ai-svc && python -m py_compile src/main.py
          fi

      - name: Run tests
        working-directory: services/ai-svc
        env:
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-asyncio httpx 2>/dev/null || true
          if [ -d tests ]; then
            pytest tests/ -v || true
          fi

  curriculum-svc:
    name: Curriculum Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/curriculum-svc/requirements.txt

      - name: Install dependencies
        run: pip install -r services/curriculum-svc/requirements.txt

      - name: Compile check
        run: cd services/curriculum-svc && python -m py_compile src/curriculum_svc/main.py

      - name: Run tests
        working-directory: services/curriculum-svc
        env:
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-asyncio httpx 2>/dev/null || true
          if [ -d tests ]; then
            pytest tests/ -v || true
          fi

  mobile-expo-check:
    name: Mobile App (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit || true

      - name: Export web build (validation)
        working-directory: apps/mobile
        run: npx expo export --platform web || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Sprint 12.6 — fail the build if any allow-list entry has expired
      # BEFORE running the scanners so we surface the policy debt loudly.
      - name: Check CVE allow-list expiry
        run: node scripts/ci/check-cve-allowlist-expiry.mjs

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          # Sprint 12.6 — gate on HIGH + CRITICAL only. Acknowledged
          # CVEs are recorded in .github/CVE_ALLOWLIST.yml with an
          # explicit expiry date.
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
        continue-on-error: false

      - name: Python security check (bandit)
        id: bandit
        run: |
          pip install bandit
          # Sprint 12.6 — blocking; only HIGH severity findings stop the
          # build. Lower-severity findings still land in the JSON
          # artifact for triage.
          bandit -r services/brain-svc/src --severity-level high -f json -o bandit-report.json
        continue-on-error: false

      - name: pnpm audit
        id: pnpm_audit
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          # Sprint 12.6 — blocking at --audit-level=high.
          pnpm audit --audit-level=high
        continue-on-error: false

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            trivy-results.sarif
            bandit-report.json
          if-no-files-found: ignore

      - name: Comment security findings on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const trivy = '${{ steps.trivy.outcome }}';
            const bandit = '${{ steps.bandit.outcome }}';
            const pnpmAudit = '${{ steps.pnpm_audit.outcome }}';
            const status = (s) => s === 'success' ? '✅ pass' : (s === 'failure' ? '⚠️ findings' : `ℹ️ ${s}`);
            const body = [
              '### Security Scan Summary (blocking — Sprint 12.6)',
              '',
              `| Scanner | Result |`,
              `| --- | --- |`,
              `| Trivy (filesystem CVEs, HIGH+CRITICAL) | ${status(trivy)} |`,
              `| Bandit (Python SAST, --severity-level high) | ${status(bandit)} |`,
              `| pnpm audit (npm CVEs, --audit-level=high) | ${status(pnpmAudit)} |`,
              '',
              'Findings are uploaded as the `security-scan-results` workflow artifact. These now BLOCK merge — acknowledged CVEs must be added to `.github/CVE_ALLOWLIST.yml` with an explicit expiry.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-and-typecheck
      - build-node
      - brain-svc
      - ai-svc
      - mobile-expo-check
      - security-scan
      - integration-and-enterprise-tests
    steps:
      - name: Report job statuses
        env:
          LINT: ${{ needs.lint-and-typecheck.result }}
          BUILD: ${{ needs.build-node.result }}
          BRAIN: ${{ needs.brain-svc.result }}
          AI: ${{ needs.ai-svc.result }}
          MOBILE: ${{ needs.mobile-expo-check.result }}
          SECURITY: ${{ needs.security-scan.result }}
          INTEG: ${{ needs.integration-and-enterprise-tests.result }}
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint & Type Check | $LINT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Node Services | $BUILD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Brain Service | $BRAIN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AI Service | $AI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mobile Expo Check | $MOBILE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan (blocking — Sprint 12.6) | $SECURITY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Integration & Enterprise Tests | $INTEG |" >> "$GITHUB_STEP_SUMMARY"
          # Sprint 12.6 — security + integration suites now block the build.
          for r in "$LINT" "$BUILD" "$BRAIN" "$AI" "$MOBILE" "$SECURITY" "$INTEG"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo ""
              echo "One or more blocking jobs failed."
              exit 1
            fi
          done
          echo ""
          echo "All blocking jobs passed."
