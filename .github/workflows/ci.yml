name: AIVO CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Client data-path ratchet (no new bare fetch)
        run: node scripts/ci/check-bare-fetch.mjs

      - name: Admin destructive-action confirmation gate
        run: node scripts/ci/check-admin-destructive-confirm.mjs

      - name: File-length ratchet (no god files, 600-line max)
        run: node scripts/ci/check-file-length.mjs

      - name: Audited-writes gate (service mutations audit or exempt)
        run: node scripts/ci/check-audited-writes.mjs

  repo-tests:
    name: Sequential Repo Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic workspace tests sequentially
        run: pnpm test

  i18n-and-completeness:
    name: i18n Coverage & No "Coming Soon"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # setup-node@v5 auto-detects the `packageManager` field in
      # package.json (pnpm@x.y.z) and tries to invoke pnpm for
      # corepack-style version pinning. Without pnpm on PATH the step
      # fails with "Unable to locate executable file: pnpm". Install
      # pnpm first; these scripts are pure node and do not need a
      # full `pnpm install`.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Check locale parity (web-v2, marketing, mobile, i18n-svc)
        run: node scripts/ci/check-i18n-coverage.mjs

      - name: Gate hardcoded English (web-v2 ratchet)
        # Locale parity above only checks that the JSON catalogs match each
        # other — it can't see English strings hardcoded in components that
        # were never extracted. This ratchet fails the build if any route
        # area gains NEW hardcoded strings above its committed baseline.
        run: node scripts/i18n-extract.mjs --gate

      - name: Check no "coming soon" prose in production code
        run: node scripts/ci/check-no-coming-soon.mjs

      # Sprint 6 anti-stub gates for the parent-assessment → collaborator
      # invites → brain build path. Pure node, no install needed.
      - name: Gate no stubs on the assessment → brain-build path
        run: node scripts/check-no-stub-on-assessment-path.mjs

      - name: Gate persistence mode-parity documentation
        run: node scripts/check-persistence-mode-parity.mjs

  build-node:
    name: Build All Node Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and services
        run: pnpm build

  # Sprint 0 Prompt 0.2 — BFF integration contract tests.
  #
  # Runs Playwright API tests at apps/web-v2/tests/integration/bff/*.spec.ts
  # against a freshly-built web-v2 (AUTH_MODE=mock). These lock the
  # canonical { ok, requestId, error|data } envelope and the auth /
  # scope / validation status codes that packages/api-client consumers
  # rely on. The job is path-gated to changes under apps/web-v2/app/api/bff/**
  # or services/**/routes/**; non-matching runs short-circuit to a green
  # no-op so the required-status check still reports success.
  #
  # Sprint 12.7 — the BFF suite is fronted by a docker-compose harness
  # (docker-compose.e2e.yml) that brings up the core service mesh
  # (identity-svc, learning-svc, comms-svc, billing-svc, postgres, redis)
  # and runs the Sprint 12 e2e suite. The previous TODO from sprint-0
  # is now closed; the new e2e step lives in the `sprint12-e2e` job
  # below.
  bff-integration:
    name: BFF Integration (web-v2 contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5

      - name: Detect BFF / service-route changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bff:
              - 'apps/web-v2/app/api/bff/**'
              - 'apps/web-v2/lib/bff/**'
              - 'apps/web-v2/lib/auth/**'
              - 'apps/web-v2/lib/db/**'
              - 'apps/web-v2/tests/integration/bff/**'
              - 'apps/web-v2/e2e/tests/brain-build-visual.spec.ts'
              - 'apps/web-v2/playwright.bff.config.ts'
              - 'services/**/routes/**'
              - 'packages/api-client/**'
              - '.github/workflows/ci.yml'

      - name: Skip (no BFF / service-route changes)
        if: steps.filter.outputs.bff != 'true'
        run: echo "No BFF or service-route changes detected — skipping integration suite."

      - uses: pnpm/action-setup@v5
        if: steps.filter.outputs.bff == 'true'

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.bff == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.filter.outputs.bff == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser deps
        if: steps.filter.outputs.bff == 'true'
        run: pnpm --filter @aivo/web-v2 exec playwright install --with-deps chromium

      - name: Build web-v2
        if: steps.filter.outputs.bff == 'true'
        env:
          NODE_ENV: development
          AUTH_MODE: mock
          AIVO_TEST_MODE: "1"
        run: pnpm --filter @aivo/web-v2 build

      - name: Start web-v2 (background, AUTH_MODE=mock)
        if: steps.filter.outputs.bff == 'true'
        env:
          NODE_ENV: development
          AUTH_MODE: mock
          AIVO_TEST_MODE: "1"
          PORT: "5000"
        run: |
          nohup pnpm --filter @aivo/web-v2 start > web-v2.log 2>&1 &
          echo $! > web-v2.pid

      - name: Wait for web-v2 to accept connections
        if: steps.filter.outputs.bff == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/; then
              echo "web-v2 is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::web-v2 did not become ready within 60s"
          tail -n 200 web-v2.log || true
          exit 1

      - name: Run BFF integration suite
        if: steps.filter.outputs.bff == 'true'
        env:
          WEB_V2_BASE_URL: http://127.0.0.1:5000
        run: |
          pnpm --filter @aivo/web-v2 exec playwright test \
            --config=playwright.bff.config.ts

      # Sprint 5/6: the visual brain build e2e. Runs under the main Playwright
      # config (testMatch includes e2e/**/*.spec.ts) against the already-
      # running web-v2 (reuseExistingServer). Flags default ON in dev
      # (NODE_ENV=development), so the brain_build_pending routing is live.
      - name: Run brain-build visual e2e
        if: steps.filter.outputs.bff == 'true'
        env:
          AIVO_FLAG_VISUAL_BRAIN_BUILD: "true"
          AIVO_FLAG_COLLAB_INVITE_STEP: "true"
        run: |
          pnpm --filter @aivo/web-v2 exec playwright test \
            e2e/tests/brain-build-visual.spec.ts

      - name: Dump web-v2 logs on failure
        if: failure() && steps.filter.outputs.bff == 'true'
        run: tail -n 500 web-v2.log || true

      - name: Stop web-v2
        if: always() && steps.filter.outputs.bff == 'true'
        run: |
          if [ -f web-v2.pid ]; then
            kill "$(cat web-v2.pid)" || true
          fi

      - name: Upload Playwright report
        if: always() && steps.filter.outputs.bff == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bff-playwright-report
          path: |
            apps/web-v2/playwright-report
            apps/web-v2/test-results
          if-no-files-found: ignore

  # Sprint B7 — first-load JS budgets for web-v2 (scripts/ci/bundle-budget.mjs
  # against scripts/ci/bundle-budgets.json). Blocking on any web-v2-affecting
  # change; the budgets file is the deliberate place a size increase lands.
  web-bundle-budget:
    name: Web Bundle Budget (web-v2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5

      - name: Detect web-v2-affecting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web-v2/**'
              - 'packages/ui/**'
              - 'packages/learner-ui/**'
              - 'packages/brand/**'
              - 'scripts/ci/bundle-budget.mjs'
              - 'scripts/ci/bundle-budgets.json'
              - '.github/workflows/ci.yml'

      - name: Skip (no web-v2-affecting changes)
        if: steps.filter.outputs.web != 'true'
        run: echo "No web-v2-affecting changes — skipping bundle budget."

      - uses: pnpm/action-setup@v5
        if: steps.filter.outputs.web == 'true'

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.web == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.filter.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web-v2
        if: steps.filter.outputs.web == 'true'
        env:
          NODE_ENV: development
          AUTH_MODE: mock
          AIVO_TEST_MODE: "1"
        run: pnpm --filter @aivo/web-v2 build

      - name: Enforce bundle budgets
        if: steps.filter.outputs.web == 'true'
        run: node scripts/ci/bundle-budget.mjs

  # Sprint 02 (remediation) — the axe-core accessibility lane. Runs every
  # @a11y-tagged Playwright spec (apps/web-v2/e2e/*-a11y*, plus any spec
  # carrying the tag) against a real server with the mock session, and
  # BLOCKS the PR on serious/critical violations. Accessibility is the
  # product's core promise; this is its runtime regression gate.
  web-a11y-axe:
    name: Accessibility axe gate (web-v2 @a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5

      - name: Detect a11y-affecting changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web-v2/**'
              - 'packages/ui/**'
              - 'packages/learner-ui/**'
              - 'packages/learner-surfaces/**'
              - 'packages/stage-ui/**'
              - 'packages/stage-runtime/**'
              - 'packages/brand/**'
              - 'packages/accessibility-contract/**'
              - 'scripts/a11y/**'
              - '.github/workflows/ci.yml'

      - name: Skip (no a11y-affecting changes)
        if: steps.filter.outputs.web != 'true'
        run: echo "No a11y-affecting changes — skipping axe lane."

      - uses: pnpm/action-setup@v5
        if: steps.filter.outputs.web == 'true'

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.web == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.filter.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser deps
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @aivo/web-v2 exec playwright install --with-deps chromium

      - name: Build web-v2
        if: steps.filter.outputs.web == 'true'
        env:
          NODE_ENV: development
          AUTH_MODE: mock
          AIVO_TEST_MODE: "1"
        run: pnpm --filter @aivo/web-v2 build

      - name: Start web-v2 (background, AUTH_MODE=mock)
        if: steps.filter.outputs.web == 'true'
        env:
          NODE_ENV: development
          AUTH_MODE: mock
          AIVO_TEST_MODE: "1"
          AIVO_FEATURE_SELF_REGULATION_HUB: "true"
          PORT: "5000"
        run: |
          nohup pnpm --filter @aivo/web-v2 start > web-v2-a11y.log 2>&1 &
          echo $! > web-v2-a11y.pid

      - name: Wait for web-v2 to accept connections
        if: steps.filter.outputs.web == 'true'
        run: |
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/; then
              echo "web-v2 is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::web-v2 did not become ready within 90s"
          tail -n 200 web-v2-a11y.log || true
          exit 1

      - name: Run @a11y axe suite
        if: steps.filter.outputs.web == 'true'
        env:
          AIVO_FEATURE_SELF_REGULATION_HUB: "true"
        run: pnpm --filter @aivo/web-v2 run test:a11y

      - name: Upload Playwright traces on failure
        if: failure() && steps.filter.outputs.web == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-a11y-axe-traces
          path: |
            apps/web-v2/test-results/
            web-v2-a11y.log
          retention-days: 7

      - name: Stop web-v2
        if: always() && steps.filter.outputs.web == 'true'
        run: |
          if [ -f web-v2-a11y.pid ]; then kill "$(cat web-v2-a11y.pid)" 2>/dev/null || true; fi

  # Sprint B7 — the living design-system gallery builds on any packages/*
  # change and lands as a PR artifact reviewers can open directly.
  storybook-build:
    name: Design-system gallery (storybook:build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5

      - name: Detect package changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pkgs:
              - 'packages/**'
              - '.github/workflows/ci.yml'

      - name: Skip (no package changes)
        if: steps.filter.outputs.pkgs != 'true'
        run: echo "No packages/* changes — skipping gallery build."

      - uses: pnpm/action-setup@v5
        if: steps.filter.outputs.pkgs == 'true'

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.pkgs == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.filter.outputs.pkgs == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build gallery
        if: steps.filter.outputs.pkgs == 'true'
        run: pnpm storybook:build

      - name: Upload gallery artifact
        if: steps.filter.outputs.pkgs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: design-system-gallery
          path: packages/learner-ui/storybook-static
          retention-days: 14

  background-jobs-tests:
    name: Background Jobs & Scheduler Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivo_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @aivo/db --filter @aivo/security --filter @aivo/observability --filter @aivo/scheduling --filter @aivo/ops-alert build

      - name: Run scheduling unit tests
        run: pnpm --filter @aivo/scheduling test

      - name: Run ops-alert unit tests
        run: pnpm --filter @aivo/ops-alert test

      - name: Run admin-svc tests (incl. crash-recovery + jobs endpoint)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm --filter @aivo/admin-svc test

      - name: Run billing-svc tests (daily-jobs + coupons + expiry-reminder)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm --filter @aivo/billing-svc test

      - name: Run family-svc tests (collaboration invites + insights)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm --filter @aivo/family-svc test

      - name: Run comms-svc tests (email-events webhook)
        run: pnpm --filter @aivo/comms-svc test

      - name: Run status-page-svc tests (status routes)
        run: pnpm --filter @aivo/status-page-svc test

      - name: Run i18n-svc tests (locale catalogue + detection)
        run: pnpm --filter @aivo/i18n-svc test

      - name: Run research-svc tests (analytics auth gate)
        run: pnpm --filter @aivo/research-svc test

      - name: Run integration-svc tests (LTI 1.3 + SIS connectors + roster pipeline)
        # No DATABASE_URL: the LTI persistence test is opt-in (skips without a
        # migrated DB); the launch, validator, connector-catalogue, and roster
        # pipeline suites run statelessly here. (integrations-svc was merged in.)
        run: pnpm --filter @aivo/integration-svc test

      - name: Build packages + services for in-process integration tests
        run: pnpm --filter "./packages/**" --filter "./services/**" build

      - name: Run in-process integration tests (service contracts, no Docker)
        run: pnpm test:integration:inprocess

  adaptive-journey:
    # Sprint 7 — the regression canary for the platform's core promise:
    # intake → baseline → θ placement → adapted lessons → upward
    # recommendation → parent approval → re-baseline. Real Postgres, every
    # service in-process, only the LLM/brain HTTP boundaries stubbed.
    name: Adaptive Learning Journey (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivo_journey
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @aivo/db --filter @aivo/scoring --filter @aivo/security --filter @aivo/audit-svc --filter @aivo/adaptive-baseline build

      - name: Bootstrap journey schema (journal + out-of-band migrations)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_journey
        run: pnpm exec tsx tests/integration/journey/setup-db.ts

      - name: Run the full-journey E2E suite
        env:
          JOURNEY_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_journey
        run: pnpm test:journey

  brain-svc:
    name: Brain Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivo_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/brain-svc/requirements.txt

      - name: Install dependencies
        run: pip install -r services/brain-svc/requirements.txt

      - name: Compile check
        run: cd services/brain-svc && python -m py_compile src/brain_svc/main.py

      - name: Run tests
        working-directory: services/brain-svc
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-cov pytest-asyncio httpx
          pytest tests/ --cov=src/brain_svc --cov-report=term-missing -v || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/brain-svc/coverage.xml
          flags: brain-svc
        continue-on-error: true

  ai-svc:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f services/ai-svc/requirements.txt ]; then
            pip install -r services/ai-svc/requirements.txt
          fi

      - name: Compile check
        run: |
          if [ -f services/ai-svc/src/main.py ]; then
            cd services/ai-svc && python -m py_compile src/main.py
          fi

      - name: Run tests
        working-directory: services/ai-svc
        env:
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-asyncio httpx 2>/dev/null || true
          if [ -d tests ]; then
            pytest tests/ -v || true
          fi

  curriculum-svc:
    name: Curriculum Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/curriculum-svc/requirements.txt

      - name: Install dependencies
        run: pip install -r services/curriculum-svc/requirements.txt

      - name: Compile check
        run: cd services/curriculum-svc && python -m py_compile src/curriculum_svc/main.py

      - name: Run tests
        working-directory: services/curriculum-svc
        env:
          ENVIRONMENT: test
        run: |
          pip install pytest pytest-asyncio httpx 2>/dev/null || true
          if [ -d tests ]; then
            pytest tests/ -v || true
          fi

      - name: Run cross-service integration tests (curriculum-svc app)
        env:
          ENVIRONMENT: test
          PYTHONPATH: services/curriculum-svc/src
        run: pytest tests/integration/python/test_curriculum_svc_integration.py -v

  mobile-expo-check:
    name: Mobile App (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit || true

      - name: Export web build (validation)
        working-directory: apps/mobile
        run: npx expo export --platform web || true

  # Sprint 10 — mobile unit tests. Runs vitest against the pure-logic
  # modules under apps/mobile (lib/feature-flags, lib/passwordStrength,
  # lib/inboxLinks, design responsive helpers, i18n parity, and the
  # learner route-shape smoke). Render-level RN tests require an Expo
  # / React Native test renderer setup; that is a separate sprint.
  mobile-tests:
    name: Mobile Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/mobile
        run: pnpm test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Python security check (bandit)
        id: bandit
        run: |
          pip install bandit
          bandit -r services/brain-svc/src -f json -o bandit-report.json
        continue-on-error: true

      - name: pnpm audit
        id: pnpm_audit
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          # GHSA-5xrq-8626-4rwp: vitest --ui server vuln. Not exploitable in CI/prod (vitest devDep, never --ui).
          pnpm audit --audit-level=high --ignore GHSA-5xrq-8626-4rwp
        continue-on-error: true

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            trivy-results.sarif
            bandit-report.json
          if-no-files-found: ignore

      - name: Comment security findings on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const trivy = '${{ steps.trivy.outcome }}';
            const bandit = '${{ steps.bandit.outcome }}';
            const pnpmAudit = '${{ steps.pnpm_audit.outcome }}';
            const status = (s) => s === 'success' ? '✅ pass' : (s === 'failure' ? '⚠️ findings' : `ℹ️ ${s}`);
            const body = [
              '### 🔒 Security Scan Summary (non-blocking)',
              '',
              `| Scanner | Result |`,
              `| --- | --- |`,
              `| Trivy (filesystem CVEs) | ${status(trivy)} |`,
              `| Bandit (Python SAST) | ${status(bandit)} |`,
              `| pnpm audit (npm CVEs) | ${status(pnpmAudit)} |`,
              '',
              'Findings are uploaded as the `security-scan-results` workflow artifact. These do not block merge but should be triaged.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  sprint12-e2e:
    # Sprint 12.7 — full docker-compose harness for the sprint 12
    # end-to-end suite (LTI launch, OIDC discovery, SCIM provisioning,
    # push fan-out). Brings up postgres + redis + identity-svc +
    # integration-svc + comms-svc, runs the Playwright sprint12 suite,
    # and tears down on exit. Path-gated to changes that could plausibly
    # affect the suite so non-relevant PRs skip the heavy build.
    name: Sprint 12 e2e (compose harness)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Detect sprint 12 changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sp12:
              - 'services/identity-svc/**'
              - 'services/integration-svc/**'
              - 'services/comms-svc/**'
              - 'e2e/tests/sprint12/**'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/ci.yml'
      - name: Skip when no sprint 12 changes
        if: steps.filter.outputs.sp12 != 'true'
        run: echo "skipped"
      - name: Install dependencies
        if: steps.filter.outputs.sp12 == 'true'
        run: pnpm install --frozen-lockfile
      - name: Bring up postgres + redis (so we can migrate before services boot)
        if: steps.filter.outputs.sp12 == 'true'
        run: docker compose -f docker-compose.e2e.yml up -d postgres redis --wait
      - name: Apply migrations to e2e database
        if: steps.filter.outputs.sp12 == 'true'
        env:
          DATABASE_URL: postgresql://aivo:aivo@localhost:55433/aivo_e2e
        # daily_job_runs and other tables must exist before identity-svc /
        # integration-svc / comms-svc tick their schedulers, otherwise the
        # first tick crashes and the harness fails to come up healthy.
        run: pnpm --filter @aivo/db run db:migrate
      - name: Bring up compose harness
        if: steps.filter.outputs.sp12 == 'true'
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait || (docker compose -f docker-compose.e2e.yml logs && exit 1)
      - name: Install Playwright browsers
        if: steps.filter.outputs.sp12 == 'true'
        run: pnpm --filter @aivo/e2e exec playwright install --with-deps chromium
      - name: Run sprint 12 e2e suite
        if: steps.filter.outputs.sp12 == 'true'
        run: pnpm --filter @aivo/e2e exec playwright test tests/sprint12 --reporter=line
      - name: Tear down
        if: always() && steps.filter.outputs.sp12 == 'true'
        run: docker compose -f docker-compose.e2e.yml down -v

  persistence-contract:
    name: Persistence Postgres Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: aivo_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @aivo/db --filter @aivo/brand build

      - name: Guard against persistence stubs
        run: node scripts/check-persistence-stubs.mjs

      - name: Store contracts (memory reference + postgres adapters)
        env:
          AIVO_TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm --filter @aivo/web-v2 exec vitest run lib/db/persistence --no-file-parallelism

      - name: Apply migrations to the service database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        run: pnpm --filter @aivo/db run db:migrate

      - name: Verify persistence schema (web_* tables present)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/aivo_test_db
        # Script lives inside packages/db so it can resolve `postgres`
        # without root-level hoisting (pnpm doesn't hoist workspace deps).
        run: node packages/db/scripts/verify-postgres-rows.mjs

  # ADR 0020 Phase 5 — Hardening & policy. Runs the pure-logic RBAC,
  # step-up, data-isolation, and learner-under-parent privacy gates so
  # any regression in the role matrix, the active-role contract, or the
  # parent/learner privacy invariant is caught before merge. Lives in
  # its own job so the failure surface points directly at the policy
  # contract rather than getting buried in a generic "tests" run.
  phase5-rbac-policy:
    name: RBAC & Policy (Phase 5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @aivo/nav and @aivo/brand
        # web-v2 vitest pulls @aivo/nav and @aivo/brand from dist/; build
        # them so the policy suite can import the canonical role matrix
        # and brand tokens.
        run: pnpm --filter @aivo/nav --filter @aivo/brand build

      - name: Nav package — RBAC matrix + step-up coverage
        run: pnpm --filter @aivo/nav test

      - name: web-v2 — step-up, data-isolation, learner-under-parent
        run: |
          pnpm --filter @aivo/web-v2 exec vitest run \
            lib/auth/step-up-coverage.test.ts \
            lib/auth/data-isolation.test.ts \
            lib/auth/learner-under-parent.test.ts \
            lib/auth/active-role.test.ts \
            lib/auth/step-up-verify.test.ts \
            components/auth/role-gate.test.tsx

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-and-typecheck
      - repo-tests
      - build-node
      - brain-svc
      - ai-svc
      - mobile-expo-check
      - mobile-tests
      - security-scan
      - sprint12-e2e
      - persistence-contract
      - phase5-rbac-policy
    steps:
      - name: Report job statuses
        env:
          LINT: ${{ needs.lint-and-typecheck.result }}
          TESTS: ${{ needs.repo-tests.result }}
          BUILD: ${{ needs.build-node.result }}
          BRAIN: ${{ needs.brain-svc.result }}
          AI: ${{ needs.ai-svc.result }}
          MOBILE: ${{ needs.mobile-expo-check.result }}
          MOBILE_TESTS: ${{ needs.mobile-tests.result }}
          SECURITY: ${{ needs.security-scan.result }}
          E2E: ${{ needs.sprint12-e2e.result }}
          PERSISTENCE: ${{ needs.persistence-contract.result }}
          PHASE5: ${{ needs.phase5-rbac-policy.result }}
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint & Type Check | $LINT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sequential Repo Test Gate | $TESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Node Services | $BUILD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Brain Service | $BRAIN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AI Service | $AI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mobile Expo Check | $MOBILE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mobile Unit Tests | $MOBILE_TESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RBAC & Policy (Phase 5) | $PHASE5 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan (non-blocking) | $SECURITY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Persistence Contract | $PERSISTENCE |" >> "$GITHUB_STEP_SUMMARY"
          # Fail summary only if a blocking job failed (security is non-blocking)
          for r in "$LINT" "$TESTS" "$BUILD" "$BRAIN" "$AI" "$MOBILE" "$MOBILE_TESTS" "$PERSISTENCE" "$PHASE5"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo ""
              echo "❌ One or more blocking jobs failed."
              exit 1
            fi
          done
          echo ""
          echo "✅ All blocking jobs passed."
