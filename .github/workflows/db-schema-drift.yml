name: db schema drift

on:
  pull_request:
    paths:
      - "packages/db/**"
      - ".github/workflows/db-schema-drift.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/**"

permissions:
  contents: read
  # actions: read is kept for any future previous-run lookup tooling we add.
  actions: read

concurrency:
  group: db-schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-schema-drift:
    name: assert every pgTable has a CREATE TABLE migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check:schema-drift
        id: drift
        run: |
          set -o pipefail
          mkdir -p /tmp/drift
          pnpm --filter @aivo/db run check:schema-drift 2>&1 | tee /tmp/drift/output.log
