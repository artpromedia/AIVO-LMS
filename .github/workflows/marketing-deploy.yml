name: Marketing Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
  workflow_dispatch:

concurrency:
  group: marketing-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  build-and-deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build marketing site
        run: pnpm exec turbo run build --filter=@aivo/marketing

      - name: Deploy to staging
        run: echo "Add staging deployment steps for your hosting provider (Vercel, Netlify, etc.)"
