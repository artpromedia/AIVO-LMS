# Dependabot configuration for AIVO Learning Platform.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Strategy:
#   - Group security and patch/minor updates so we don't drown in PRs.
#   - Major updates open as separate PRs to force human review.
#   - GitHub Actions versions are pinned by tag; weekly updates keep
#     us current with security advisories on third-party actions.
#
# When adding a new Python service, add a corresponding `pip` entry
# pointing at its `requirements.txt` directory.

version: 2
updates:
  # ───── Node / pnpm workspace (root) ─────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"
    ignore:
      # Workspace-pinned overrides live in package.json#pnpm.overrides.
      # Dependabot cannot reason about those, so let the maintainers
      # bump them manually.
      - dependency-name: "fastify"
      - dependency-name: "tar"

  # ───── GitHub Actions ─────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # ───── Docker base images ─────
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  # ───── Python services ─────
  - package-ecosystem: "pip"
    directory: "/services/brain-svc"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "brain-svc"
    commit-message:
      prefix: "deps(brain-svc)"
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "pip"
    directory: "/services/ai-svc"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "ai-svc"
    commit-message:
      prefix: "deps(ai-svc)"
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "pip"
    directory: "/services/curriculum-svc"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "curriculum-svc"
    commit-message:
      prefix: "deps(curriculum-svc)"
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"
